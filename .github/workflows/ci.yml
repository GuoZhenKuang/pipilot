name: ci

on:
    workflow_dispatch:
    pull_request:
    push:
        branches: [master]

permissions:
    contents: read

jobs:
    android:
        name: Android static, unit, lint, and assembly
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7
            - name: Set up JDK 21 for stable detekt
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 21
            - name: Set up JDK 25 build runtime
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 25
                  cache: gradle
            - uses: android-actions/setup-android@v4
            - name: Install Android SDK 37
              run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
            - name: Verify toolchain
              run: |
                  java -version
                  ./gradlew --version
                  test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
                  test -x "$ANDROID_HOME/build-tools/37.0.0/aapt2"
            - name: Verify Android
              run: ./gradlew clean ktlintCheck detekt test :benchmark:compileBenchmarkKotlin :app:lintDebug :app:assembleDebug :app:assembleRelease
            - name: Upload test reports on failure
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: test-reports
                  path: |
                      **/build/reports/tests/
                      **/build/test-results/
                  if-no-files-found: ignore

            - name: Compile Android test sources
              run: ./gradlew :app:compileDebugAndroidTestKotlin
            - name: Upload debug APK
              uses: actions/upload-artifact@v7
              with:
                  name: pipilot-debug
                  path: app/build/outputs/apk/debug/app-debug.apk
                  if-no-files-found: error

    bridge:
        name: Bridge checks and production audit
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: bridge
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: 10.33.0
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: bridge/pnpm-lock.yaml
            - run: pnpm install --frozen-lockfile
            - run: pnpm run check
            - run: pnpm audit --prod --audit-level high
