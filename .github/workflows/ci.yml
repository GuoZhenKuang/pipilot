name: ci

on:
    workflow_dispatch:
    pull_request:
    push:
        branches: [master]

permissions:
    contents: read

jobs:
    android:
        name: Android static, unit, lint, and assembly
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - name: Set up JDK 25 build runtime
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 25
            - name: Verify toolchain
              run: |
                  java -version
                  ./gradlew --version
            - name: Verify Android
              run: ./gradlew clean ktlintCheck detekt test :benchmark:compileBenchmarkKotlin :app:lintDebug :app:assembleDebug :app:assembleRelease
            - name: Upload test reports on failure
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: test-reports
                  path: |
                      **/build/reports/tests/
                      **/build/test-results/
                  if-no-files-found: ignore

            - name: Compile Android test sources
              run: ./gradlew :app:compileDebugAndroidTestKotlin
            - name: Upload debug APK
              uses: actions/upload-artifact@v4
              with:
                  name: pipilot-debug
                  path: app/build/outputs/apk/debug/app-debug.apk
                  if-no-files-found: error

    bridge:
        name: Bridge checks and production audit
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10.33.0
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Install dependencies
              run: cd bridge && pnpm install --frozen-lockfile
            - name: Run check
              run: cd bridge && pnpm run check
            - name: Audit dependencies
              run: cd bridge && pnpm audit --prod --audit-level high
